<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Blood Donation Matcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-droplet-half me-2"></i>Blood Donation Matcher</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="participant-login.html"><i class="bi bi-person"></i> Participant</a></li>
      </ul>
    </div>
  </nav>

  <main class="container" style="max-width:560px; padding:64px 0;">
    <div class="card">
      <div class="card-header bg-white text-danger fw-semibold"><i class="bi bi-shield-lock me-1"></i> Admin Login</div>
      <div class="card-body">
        <form id="adminLoginForm" class="vstack gap-2">
          <input class="form-control" id="aUser" placeholder="Username" required>
          <input class="form-control" id="aPass" type="password" placeholder="Password" required>
          <button class="btn btn-outline-danger" type="submit">Login as Admin</button>
          </form>
      </div>
    </div>
  </main>


  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
