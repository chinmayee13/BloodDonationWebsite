<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Blood Donation Matcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-droplet-half me-2"></i>Blood Donation Matcher</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="participant-login.html"><i class="bi bi-person"></i> Participant</a></li>
        </ul>
        <section class="page-hero">
  <div class="container">
    <h1 class="h4 m-0">
      <!-- Change text per page -->
      <i class="bi bi-person-plus"></i> Register as Donor
    </h1>
  </div>
</section>

        <button class="btn btn-light btn-sm ms-2" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="card shadow-sm">
      <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
        <span><i class="bi bi-people-fill"></i> Donor Records</span>
        <button class="btn btn-light btn-sm" id="adminExport"><i class="bi bi-download"></i> Export CSV</button>
      </div>
      <div class="card-body">
        <div class="row g-3 mb-3">
          <div class="col-md-5"><input class="form-control" id="adminSearchCity" placeholder="Search by City"></div>
          <div class="col-md-3">
            <select class="form-select" id="adminSearchGroup">
              <option value="">All Groups</option>
              <option>O-</option><option>O+</option><option>A-</option><option>A+</option>
              <option>B-</option><option>B+</option><option>AB-</option><option>AB+</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered text-center align-middle" id="donorTable">
            <thead class="table-danger">
              <tr><th>#</th><th>Name</th><th>Group</th><th>City</th><th>Phone</th><th>Added By</th><th>Date</th><th>Action</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    $(function(){
      guardRoute('admin');
      renderAdminTable();
      $('#logoutBtn').on('click', clearSession);
      $('#adminSearchCity, #adminSearchGroup').on('input change', renderAdminTable);
      $('#adminExport').on('click', exportDonorsCSV);
    });
  </script>
</body>
</html>
