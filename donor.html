<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donor — Blood Donation Matcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-droplet-half me-2"></i>Blood Donation Matcher</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="recipient.html"><i class="bi bi-search-heart"></i> Recipient</a></li>
          <li class="nav-item"><a class="nav-link" href="admin.html"><i class="bi bi-shield-lock"></i> Admin</a></li>
          <li class="nav-item"><a class="nav-link" href="participant-login.html"><i class="bi bi-box-arrow-in-right"></i> Login</a></li>
        </ul>
        <section class="page-hero">
  <div class="container">
    <h1 class="h4 m-0">
      <!-- Change text per page -->
      <i class="bi bi-person-plus"></i> Register as Donor
    </h1>
  </div>
</section>

        <button class="btn btn-light btn-sm ms-2" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width:720px;">
    <div class="card">
      <div class="card-header bg-danger text-white"><i class="bi bi-person-plus"></i> Register as Donor</div>
      <div class="card-body">
        <form id="donorForm">
          <input class="form-control mb-2" id="dName" placeholder="Full Name" required>
          <select class="form-select mb-2" id="dGroup" required>
            <option value="" disabled selected>Blood Group</option>
            <option>O-</option><option>O+</option><option>A-</option><option>A+</option>
            <option>B-</option><option>B+</option><option>AB-</option><option>AB+</option>
          </select>
          <input class="form-control mb-2" id="dCity" placeholder="City" required>
          <input class="form-control mb-3" id="dPhone" placeholder="Phone" required>
          <button class="btn btn-danger w-100">Save Donor</button>
        </form>
      </div>
    </div>
  </main>

 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    $(function(){ guardRoute('participant'); renderSessionEmail(); bindDonorPage(); });
  </script>
</body>
</html>
