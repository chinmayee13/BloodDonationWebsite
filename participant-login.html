<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Participant Login — Blood Donation Matcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-droplet-half me-2"></i>Blood Donation Matcher</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="admin-login.html"><i class="bi bi-shield-lock"></i> Admin</a></li>
      </ul>
    </div>
  </nav>

  <main class="container" style="max-width:560px; padding:64px 0;">
    <div class="card">
      <div class="card-header bg-white text-danger fw-semibold"><i class="bi bi-person me-1"></i> Participant Login</div>
      <div class="card-body">
        <form id="participantLoginForm" class="vstack gap-2">
          <input class="form-control" id="pEmail" type="email" placeholder="Email" required>
          <input class="form-control" id="pPassword" type="password" placeholder="Password" required>
          <button class="btn btn-danger" type="submit">Login</button>
          <div class="small text-secondary">New here? <a href="#" id="showRegister" class="text-danger">Create an account</a></div>
        </form>

        <form id="participantRegisterForm" class="vstack gap-2 d-none mt-2">
          <input class="form-control" id="rpEmail" type="email" placeholder="Email" required>
          <input class="form-control" id="rpPassword" type="password" placeholder="Password" required>
          <button class="btn btn-outline-danger" type="submit">Register</button>
          <div class="small text-secondary">Already have an account? <a href="#" id="showLogin" class="text-danger">Login</a></div>
        </form>
      </div>
    </div>
  </main>


  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    $(function(){
      $('#showRegister').on('click', e=>{e.preventDefault();$('#participantLoginForm').addClass('d-none');$('#participantRegisterForm').removeClass('d-none');});
      $('#showLogin').on('click', e=>{e.preventDefault();$('#participantRegisterForm').addClass('d-none');$('#participantLoginForm').removeClass('d-none');});
    });
  </script>
</body>
</html>
